<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Formulario-Html-Css</title>
   <!-- Agregamos la fuente Roboto -->
   <link rel="stylesheet" href="style.css" 
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
   <!-- Google Fonts -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik+Dirt&display=swap" rel="stylesheet">

</head>

<body>
   <div class="container">
      <h1>Formulario</h1>
      <form>
         <div class="grupo">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" required>
         </div>
         <div class="grupo">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" required>
         </div>
         <div class="grupo">
            <label for="fecha-nacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
         </div>
         <div class="grupo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" required>
         </div>
         <div class="grupo">
            <label>Género</label>
            <select>
               <option value="">SELECCIONE UNA OPCIÓN</option>
               <option value="masculino">Masculino</option>
               <option value="femenino">Femenino</option>
            </select>
         </div>
         <div class="grupo">
            <label for="comentario">Comentario</label>
            <textarea id="comentario" name="comentario" rows="4" cols="50"></textarea>
         </div>
         <button name="button">Enviar</button>
      </form>
   </div>

</body>

</html>
